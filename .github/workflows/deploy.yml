# Deploys the API to Cloud Run after CI passes on main.
# Auth uses Workload Identity Federation: GitHub gets a short lived token for each run,
# so no long lived Google Cloud keys are ever stored in GitHub.
name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: tenantwise-api

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source backend \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 20 \
            --memory 1Gi \
            --cpu 1 \
            --cpu-boost \
            --timeout 60 \
            --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,DATABASE_URL=database-url:latest,IP_HASH_SALT=ip-hash-salt:latest" \
            --set-env-vars "^;^ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }};SCOPE_THRESHOLD=${{ vars.SCOPE_THRESHOLD }}"
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$URL/health"
