# Quality gates. Cheap checks run on every push; the paid LLM eval runs only on pull
# requests that change prompts, retrieval, routing or the golden set.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  retrieval-eval:
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with: { path: .models, key: fastembed-bge-small-v1.5 }
      - name: Retrieval eval (free, deterministic)
        run: python -m evals.run_evals --mode retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: retrieval-report, path: backend/evals/reports/ }

  full-eval:
    if: github.event_name == 'pull_request'
    needs: retrieval-eval
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            llm:
              - 'backend/app/generation.py'
              - 'backend/app/retrieval.py'
              - 'backend/app/router.py'
              - 'backend/app/guardrails.py'
              - 'backend/app/config.py'
              - 'backend/evals/**'
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.llm == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - if: steps.changes.outputs.llm == 'true'
        run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        if: steps.changes.outputs.llm == 'true'
        with: { path: .models, key: fastembed-bge-small-v1.5 }
      - uses: actions/cache@v4
        if: steps.changes.outputs.llm == 'true'
        with:
          path: backend/evals/.cache
          key: eval-cache-${{ hashFiles('backend/app/**', 'backend/evals/golden_set.jsonl') }}
          restore-keys: eval-cache-
      - name: Full LLM eval (gated)
        if: steps.changes.outputs.llm == 'true'
        run: python -m evals.run_evals --mode full --strategy routed
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.llm == 'true'
        with: { name: full-eval-report, path: backend/evals/reports/ }
