# Monthly refresh: the law and the rent increase guideline change. Content hashing means
# only changed chunks are embedded, so this is quick and nearly free.
name: Monthly reingest

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  reingest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODEL_CACHE_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with: { path: .models, key: fastembed-bge-small-v1.5 }
      - run: python -m ingestion.ingest
      - name: Retrieval eval after refresh
        run: python -m evals.run_evals --mode retrieval
