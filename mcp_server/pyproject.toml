[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenantwise-mcp"
version = "0.1.0"
description = "MCP server for searching Ontario residential tenancy law with section level citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeffano John", email = "jeffanojohn@gmail.com" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://tenantwise.jeffanojohn.com"
Source = "https://github.com/Jeffano/tenantwise"

[project.scripts]
tenantwise-mcp = "tenantwise_mcp.server:main"
